<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Safari iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRIBLUE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0891b2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Prevent Safari zoom on input focus -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      input, select, textarea { font-size: 16px !important; }
      body { -webkit-text-size-adjust: 100%; margin: 0; }

      /* ── Splash de démarrage : affiché instantanément, avant même que le
         bundle React soit téléchargé. Retiré dès que React monte. ── */
      #bb-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #f1f5f9;
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
      }
      #bb-splash .bb-logo {
        width: 190px; max-width: 70vw; height: auto;
        filter: drop-shadow(0 8px 24px rgba(8,145,178,0.25));
        animation: bb-float 2.4s ease-in-out infinite;
      }
      #bb-splash .bb-bar {
        width: 160px; height: 4px; border-radius: 2px;
        background: #e2e8f0; overflow: hidden; position: relative;
      }
      #bb-splash .bb-bar::after {
        content: ""; position: absolute; inset: 0;
        border-radius: 2px;
        background: linear-gradient(90deg, #0891b2, #22d3ee, #7c3aed);
        transform: translateX(-100%);
        animation: bb-slide 1.1s cubic-bezier(.65,0,.35,1) infinite;
      }
      #bb-splash .bb-txt { font-size: 12px; color: #94a3b8; font-weight: 600; letter-spacing: .3px; }
      @keyframes bb-float {
        0%,100% { transform: translateY(0) scale(1); }
        50%     { transform: translateY(-7px) scale(1.015); }
      }
      @keyframes bb-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #bb-splash .bb-logo, #bb-splash .bb-bar::after { animation: none; }
        #bb-splash .bb-bar::after { transform: none; }
      }
    </style>
    <title>BRIBLUE CRM</title>
    <!-- SheetJS : uniquement requis par l'import Connecteam. Chargé en différé
         pour ne pas bloquer le premier rendu (script de ~900 ko). -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="bb-splash">
      <img class="bb-logo" src="/logo-briblue.png" alt="Bri'Blue" />
      <div class="bb-bar"></div>
      <div class="bb-txt">Chargement…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
